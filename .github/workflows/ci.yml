name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Check generated contract is up to date
        run: |
          pnpm generate
          git add --intent-to-add packages/api/generated
          git diff --exit-code -- packages/api/generated
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: docker build -t calendar .
      - name: Smoke-test the container on a custom PORT
        run: |
          docker run -d --name calendar -e PORT=8080 -p 8080:8080 calendar
          for i in $(seq 30); do curl -sf localhost:8080/api/event-types && break; sleep 1; done
          curl -sf localhost:8080/ | grep -q '<div id="root">'
          curl -sf localhost:8080/admin | grep -q '<div id="root">'
